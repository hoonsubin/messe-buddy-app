# LiteLLM Proxy Configuration — MesseBuddy
#
# This file is the ONLY place an admin needs to touch to:
#   1. Switch AI providers (OpenAI → Anthropic → Azure → any OpenAI-compatible)
#   2. Update the chatbot's knowledge base (re-run the ingest service)
#   3. Tune RAG strictness (RAG_TOP_K, RAG_MIN_SIMILARITY via .env)
#
# The PWA (useChatStream hook) always calls the same endpoint with the same
# request shape. It is unaware of which provider or documents are in use.
#
# Docs: https://docs.litellm.ai/docs/proxy/config

model_list:
  # ── OpenAI ───────────────────────────────────────────────────────────────────
  # "policy-assistant" is the stable alias the PWA sends.
  # To swap providers: change the litellm_params block below. Never touch PWA code.
  - model_name: policy-assistant
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic (uncomment to use instead) ────────────────────────────────────
  # - model_name: policy-assistant
  #   litellm_params:
  #     model: anthropic/claude-haiku-4-5-20251001
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # ── Azure OpenAI (uncomment to use instead) ──────────────────────────────────
  # - model_name: policy-assistant
  #   litellm_params:
  #     model: azure/gpt-4o-mini
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: "2024-02-15-preview"

  # ── Ollama / local model (uncomment to use instead) ──────────────────────────
  # - model_name: policy-assistant
  #   litellm_params:
  #     model: ollama/llama3
  #     api_base: http://host.docker.internal:11434


# ── RAG + document-only enforcement guardrail ──────────────────────────────────
# rag_hook.py is mounted into the container at /app/rag_hook.py.
# LiteLLM loads it as "rag_hook.RAGHook" (module.ClassName).
#
# `mode: "pre_call"` → runs async_pre_call_hook before the LLM call.
# `default_on: true` → applies to ALL requests. The PWA sends standard
#   OpenAI-shaped requests; no "guardrails" field needed in the request body.
#
# What the hook does:
#   1. Embeds the user's message via EMBEDDING_MODEL.
#   2. Queries pgvector for top RAG_TOP_K chunks above RAG_MIN_SIMILARITY.
#   3a. Chunks found → injects them into the system prompt and forwards to LLM.
#   3b. No chunks → returns a canned refusal; upstream LLM never called.
#
# To update knowledge base: add/edit files in consume-docs/, then:
#   docker compose run --rm ingest
# No proxy restart required.
#
# To tune retrieval: edit RAG_TOP_K and RAG_MIN_SIMILARITY in .env, then:
#   docker compose up -d litellm
guardrails:
  - guardrail_name: "rag-enforcer"
    litellm_params:
      guardrail: rag_hook.RAGHook      # <module>.<ClassName> — loaded from /app/
      mode: "pre_call"                 # runs async_pre_call_hook
      default_on: true                 # applies to every request; no client change needed


# ── Router settings ────────────────────────────────────────────────────────────
router_settings:
  routing_strategy: simple-shuffle


# ── General settings ───────────────────────────────────────────────────────────
general_settings:
  # Base system prompt. The RAG hook appends retrieved document context after
  # this. Two-layer enforcement: this prompt forbids general knowledge; the
  # hook's similarity threshold blocks requests with no matching context at all.
  default_system_prompt: |
    You are a document-based onboarding assistant for new employees at Messe München,
    integrated into the MesseBuddy onboarding platform.

    STRICT RULES — follow these without exception:
    - Answer ONLY from company documents explicitly provided to you in this conversation.
    - Do NOT use general knowledge, training data, or any information not in the provided documents.
    - If the provided documents do not contain a clear answer, say: "That information is not in the documents I have access to. Please contact HR or your manager."
    - Do NOT speculate, infer beyond what is written, or fill gaps with general knowledge.
    - Do NOT answer questions unrelated to the provided company documents.

    Your role is to help employees find information in Messe München's onboarding materials.
    Keep answers concise and factual. Cite the source document section when possible.

  # Guards the proxy management endpoints (/health, /model/info, etc.)
  master_key: os.environ/LITELLM_MASTER_KEY

  # Drop unknown parameters so the PWA can send standard OpenAI-shaped requests
  drop_params: true
