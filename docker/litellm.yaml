# LiteLLM Proxy Configuration - MesseBuddy
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
#       https://docs.litellm.ai/docs/completion/knowledgebase

model_list:
  # ── OpenAI (direct) ──────────────────────────────────────────────────────────
  # "policy-assistant" is the stable alias the PWA sends.
  # vector_store_ids makes RAG always-on for this model - every request
  # includes relevant document context automatically.
  # To swap providers: change the litellm_params block below. Never touch PWA code.
  - model_name: policy-assistant
    litellm_params:
      model: openai/ibm/granite-4.0-h-tiny
      api_base: https://litellm.hoonlabs.xyz/v1
      api_key: os.environ/LLM_PROXY_KEY
      vector_store_ids: ["messe-buddy-kb"]

  # ── Anthropic (uncomment to use instead) ────────────────────────────────────
  # - model_name: policy-assistant
  #   litellm_params:
  #     model: anthropic/claude-haiku-4-5-20251001
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #     vector_store_ids: ["messe-buddy-kb"]

  # ── Azure OpenAI (uncomment to use instead) ──────────────────────────────────
  # - model_name: policy-assistant
  #   litellm_params:
  #     model: azure/gpt-4o-mini
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: "2024-02-15-preview"
  #     vector_store_ids: ["messe-buddy-kb"]

  # ── HoonLabs LiteLLM Proxy ──────────────────────────────────────────────────
  # Upstream LiteLLM proxy at https://litellm.hoonlabs.xyz.
  # API key stored in LLM_PROXY_KEY environment variable.
  # All models use openai/ provider prefix since the upstream is
  # an OpenAI-compatible LiteLLM proxy.

  # Chat: IBM Granite 4.0 H Tiny
  - model_name: ibm-granite-tiny
    litellm_params:
      model: openai/ibm/granite-4.0-h-tiny
      api_base: https://litellm.hoonlabs.xyz/v1
      api_key: os.environ/LLM_PROXY_KEY

  # Embedding: Nomic Embed Text v2 MoE (768 dim, Matryoshka-capable)
  - model_name: nomic-embed-text-v2-moe
    litellm_params:
      model: openai/nomic-ai/embed-text-v2-moe
      api_base: https://litellm.hoonlabs.xyz/v1
      api_key: os.environ/LLM_PROXY_KEY

  # Reranker: BGE Reranker v2 M3 (cross-encoder, used by the pgvector connector
  # to re-rank retrieved chunks before they're injected into the prompt).
  # NOTE: provider MUST be `hosted_vllm/` — it exposes LiteLLM's `/rerank`
  # endpoint. The `openai/` provider does NOT support rerank. The upstream
  # (litellm.hoonlabs.xyz) serves this model from a vLLM rerank runtime.
  - model_name: bge-reranker-v2-m3
    litellm_params:
      model: hosted_vllm/gpustack/bge-reranker-v2-m3
      api_base: https://litellm.hoonlabs.xyz/v1
      api_key: os.environ/LLM_PROXY_KEY


# ── Vector Store Registry ─────────────────────────────────────────────────────
# Configured to use the litellm-pgvector connector service.
# Documents uploaded via Admin UI or POST /document/upload are routed through
# this connector: chunk → embed → store in pgvector.
# At query time, LiteLLM calls the connector's search endpoint to retrieve
# relevant chunks, then injects them into the prompt before calling the LLM.
vector_store_registry:
  - vector_store_name: "messe-buddy-knowledge-base"
    litellm_params:
      vector_store_id: "messe-buddy-kb"
      custom_llm_provider: "pg_vector"
      api_base: os.environ/PG_VECTOR_API_BASE
      api_key: os.environ/PG_VECTOR_API_KEY
      vector_store_description: "MesseBuddy onboarding and company documents"


# ── Router settings ────────────────────────────────────────────────────────────
router_settings:
  routing_strategy: simple-shuffle


# ── General settings ───────────────────────────────────────────────────────────
general_settings:
  # ⚠️ NOTE: `default_system_prompt` is NOT a supported LiteLLM setting - the
  # proxy ignores it. The PWA injects this system prompt itself as the first
  # message (see src/config/llm.ts → LLM_SYSTEM_PROMPT). Kept here only as the
  # canonical reference text; keep the two in sync. RAG (vector_store_ids on the
  # model) is injected server-side regardless.
  default_system_prompt: |
    You are a document-based onboarding assistant for new employees at Messe München,
    integrated into the MesseBuddy onboarding platform.

    STRICT RULES - follow these without exception:
    - Answer ONLY from company documents provided to you in this conversation.
    - Do NOT use general knowledge, training data, or any information not in the provided documents.
    - If the provided documents do not contain a clear answer, say: "That information is not in the documents I have access to. Please contact HR or your manager."
    - Do NOT speculate, infer beyond what is written, or fill gaps with general knowledge.
    - Do NOT answer questions unrelated to the provided company documents.

    Your role is to help employees find information in Messe München's onboarding materials.
    Keep answers concise and factual. Cite the source document section when possible.

  # Guards the proxy management endpoints (/health, /model/info, etc.)
  master_key: os.environ/LITELLM_MASTER_KEY

  # For internal development purposes
  allow_client_side_credentials: true

  # Drop unknown parameters so the PWA can send standard OpenAI-shaped requests
  drop_params: true
