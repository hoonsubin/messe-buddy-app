# ── HTTPS — Secure Context for crypto.subtle and getUserMedia ─────────────────
#
# Self-signed cert is auto-generated at container startup by entrypoint.sh.
# Browsers show a "Not secure" warning for self-signed certs; you can click
# through it (Advanced → Proceed) and all Secure Context APIs will work.
#
# For fully trusted HTTPS on LAN devices (no warning), use mkcert on the host:
#   brew install mkcert && mkcert -install
#   mkcert <your-lan-ip> localhost 127.0.0.1
#   # Then in docker-compose.yml add a volume mount:
#   #   - ./certs/<lan-ip>+2.pem:/etc/nginx/ssl/server.crt:ro
#   #   - ./certs/<lan-ip>+2-key.pem:/etc/nginx/ssl/server.key:ro
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Static assets: long cache ───────────────────────────────────────────────
    # Vite outputs hashed filenames for JS/CSS; serve them with a long cache.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── PWA manifest + service worker: no cache ────────────────────────────────
    location ~* (?:manifest\.webmanifest|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── PocketBase API + Admin UI ───────────────────────────────────────────────
    # Proxy /api/ and /_/ to PocketBase running on :8090 inside the container.
    location ~ ^/(api|_)(/|$) {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # SSE (Server-Sent Events) support
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # ── LiteLLM proxy (AI policy assistant) ─────────────────────────────────────
    # The virtual key is injected at container start (envsubst ${KEY} in
    # entrypoint.sh), so it never reaches the browser.
    location /llm/ {
        proxy_pass         http://litellm:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Authorization "Bearer ${KEY}";
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ── HTTP ───────────────────────────────────────────────────────────────────────
# localhost is already a Secure Context on plain HTTP; a public IP or domain is
# NOT (crypto.subtle, getUserMedia etc. are unavailable — see qrPayload.ts).
# So :80 exists only to (a) answer ACME HTTP-01 challenges for cert issuance/
# renewal and (b) redirect everything else to HTTPS. It must not serve the app.
server {
    listen 80;
    server_name ${DOMAIN};

    # certbot webroot — shared with the `certbot` sidecar container (see
    # docker-compose.yml). It writes its HTTP-01 challenge files here;
    # Let's Encrypt's validation server fetches them over this exact
    # plain-HTTP path before HTTPS is trusted. Domain comes from PUBLIC_DOMAIN.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
