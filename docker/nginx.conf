server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Static assets: long cache ───────────────────────────────────────────────
    # Vite outputs hashed filenames for JS/CSS; serve them with a long cache.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── PWA manifest + service worker: no cache ────────────────────────────────
    location ~* (?:manifest\.webmanifest|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── PocketBase API + Admin UI ───────────────────────────────────────────────
    # Proxy /api/ and /_/ to PocketBase running on :8090 inside the container.
    # This keeps everything behind a single origin for the browser.
    location ~ ^/(api|_)(/|$) {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # SSE (Server-Sent Events) support
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────────
    # All other paths are handled by the React app (flat useState router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
