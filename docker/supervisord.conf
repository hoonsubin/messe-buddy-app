[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
user=root

; ── nginx — serves the compiled PWA on :80 ──────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── PocketBase Server — Go wrapper with embedded migrations ─────────────────────
; --dir points to the named volume mounted at /pb_data (SQLite + file storage).
; --http 0.0.0.0:8090 binds to all interfaces so nginx can proxy to it.
; PB_AUTO_MIGRATE is read from the environment (set in docker-compose.yml).
; Migrations auto-create all collections on first run.
[program:pocketbase]
command=/usr/local/bin/pocketbase-server serve --dir=/pb_data --http=0.0.0.0:8090
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── nginx cert reloader ──────────────────────────────────────────────────────────
; The `certbot` sidecar (docker-compose.yml) renews the cert into the shared
; nginx_ssl volume on its own schedule but has no way to signal this container
; (no shared docker socket, by design — see docker-compose.yml comment on the
; litellm port binding for why we avoid that). `nginx -s reload` re-reads the
; cert files from disk without dropping connections; running it periodically
; is cheap and idempotent, so a fixed interval is simpler than file-watching.
[program:nginx-reload]
command=sh -c "while true; do sleep 43200; nginx -s reload 2>&1; done"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
