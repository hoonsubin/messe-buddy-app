[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
user=root

; ── nginx — serves the compiled PWA on :80 ─────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── PocketBase — REST + SSE backend on :8090 ───────────────────────────────────
; --dir points to the named volume mounted at /pb_data (SQLite + file storage).
; --http 0.0.0.0:8090 binds to all interfaces so docker-compose can expose the port.
[program:pocketbase]
command=/usr/local/bin/pocketbase serve --dir=/pb_data --http=0.0.0.0:8090
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
