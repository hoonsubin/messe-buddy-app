# MesseBuddy - Docker Compose
# Services: app (nginx+PB), litellm-proxy, pgvector-connector, litellm-db, vector-db, file-watcher

services:

  # -- PostgreSQL (LiteLLM metadata) --
  # Separate from vector-db to avoid Prisma schema conflicts.
  litellm-db:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -- PostgreSQL + pgvector (Vector store) --
  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_VECTOR_DB:-litellm_vector}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - vector_db_data:/var/lib/postgresql/data
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_VECTOR_DB:-litellm_vector}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -- PG Vector Store Connector --
  litellm-pgvector:
    build:
      context: ./docker/litellm-pgvector
    container_name: litellm-pgvector
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@vector-db:5432/${POSTGRES_VECTOR_DB:-litellm_vector}
      SERVER_API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      EMBEDDING__MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING__BASE_URL: http://litellm:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      EMBEDDING__DIMENSIONS: ${EMBEDDING_DIM:-1536}
      RERANK__ENABLED: ${RERANK_ENABLED:-false}
      RERANK__MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      RERANK__CANDIDATES: ${RERANK_CANDIDATES:-30}
      HOST: "0.0.0.0"
      PORT: "8001"
      DB_FIELDS__ID_FIELD: "id"
      DB_FIELDS__CONTENT_FIELD: "content"
      DB_FIELDS__METADATA_FIELD: "metadata"
      DB_FIELDS__EMBEDDING_FIELD: "embedding"
      DB_FIELDS__VECTOR_STORE_ID_FIELD: "vector_store_id"
      DB_FIELDS__CREATED_AT_FIELD: "created_at"
    command: >
      sh -c "python enable_vector_ext.py && python -m prisma db push --skip-generate && uvicorn main:app --host 0.0.0.0 --port 8001"
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -- LiteLLM Proxy --
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      # Bound to loopback only — the app's browser-facing /llm proxy already
      # covers normal use (see nginx.conf); this stays reachable for the
      # operator via `ssh -L 4000:localhost:4000` for the admin UI, but not
      # from the public internet. Do not publish this on 0.0.0.0 in prod:
      # a direct :4000 connection bypasses nginx's server-side Authorization
      # injection and would need the raw LITELLM_MASTER_KEY to do anything.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      LLM_SERVER_API_KEY: ${LLM_SERVER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      PG_VECTOR_API_BASE: http://litellm-pgvector:8001
      PG_VECTOR_API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@litellm-db:5432/${POSTGRES_DB:-litellm}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - litellm-internal
      - litellm-external
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python3",
          "-c",
          "import urllib.request, json, sys; r = urllib.request.urlopen('http://localhost:4000/health/readiness'); data = json.loads(r.read()); sys.exit(0 if data.get('status') == 'healthy' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -- File Watcher --
  # Bootstraps vector store + LiteLLM registration once (idempotent), mints PWA virtual key, then watches consume-docs.
  file-watcher:
    build:
      context: ./docker/file-watcher
    container_name: messebuddy-file-watcher
    environment:
      POSTGRES_VECTOR_DB: ${POSTGRES_VECTOR_DB:-litellm_vector}
      POSTGRES_VECTOR_HOST: vector-db
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      VECTOR_STORE_ID: "messe-buddy-kb"
      VECTOR_STORE_NAME: "messe-buddy-knowledge-base"
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      LITELLM_DB_HOST: litellm-db
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      # Must match litellm-pgvector's EMBEDDING__DIMENSIONS below and the
      # vector(N) column in docker/litellm-pgvector/prisma/schema.prisma —
      # this is what actually gets sent as `dimensions` on the /v1/embeddings
      # request (watcher.py), not just a label. Previously unset here, so
      # Gemini always returned its native 3072-dim vector no matter what
      # EMBEDDING_DIM was set to elsewhere.
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # Char-based chunking sized for reranker's 512-token vLLM batch limit (~3 chars/token worst case).
      CHUNK_SIZE: ${CHUNK_SIZE:-1500}
      OVERLAP: ${OVERLAP:-150}
    volumes:
      - ./consume-docs:/consume-docs:ro
      - app_runtime:/runtime
    depends_on:
      vector-db:
        condition: service_healthy
      litellm-pgvector:
        condition: service_healthy
      litellm:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    networks:
      - litellm-internal
    restart: unless-stopped

  # -- Certbot (automated HTTPS) --
  # Issues + renews the Let's Encrypt cert for PUBLIC_DOMAIN and drops it into
  # the shared nginx_ssl volume as server.crt/server.key
  certbot:
    build:
      context: ./docker/certbot
    container_name: messebuddy-certbot
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - certbot_webroot:/var/www/certbot
      - ./docker/certbot/letsencrypt:/etc/letsencrypt
      - nginx_ssl:/nginx_ssl
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # -- App (PWA + PocketBase) --
  app:
    build:
      context: .
      args:
        VITE_PB_URL: /
        VITE_USE_MOCK_PB: ${VITE_USE_MOCK_PB:-false}
        VITE_LITELLM_URL: ${VITE_LITELLM_URL:-http://localhost:4000}
        VITE_LITELLM_MODEL: ${VITE_LITELLM_MODEL:-policy-assistant}
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - pb_data:/pb_data
      - app_runtime:/runtime:ro
      # Populated by the certbot service above (or left empty for local/LAN
      # dev, in which case entrypoint.sh generates a self-signed cert here).
      - nginx_ssl:/etc/nginx/ssl
      # ACME HTTP-01 webroot, shared with the certbot service. Read-only here:
      # only certbot needs to write challenge files.
      - certbot_webroot:/var/www/certbot:ro
    environment:
      PB_AUTO_MIGRATE: ${PB_AUTO_MIGRATE:-true}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      # Read by entrypoint.sh to set nginx's server_name/SNI. Empty → "_"
      # (catch-all), matching the old LAN/dev behavior exactly.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      # NOT certbot: certbot's HTTP-01 challenge needs this container's nginx
      # already answering on :80 (see docker/nginx.conf's acme-challenge
      # location), so app must come up independently, not after certbot —
      # it's certbot that waits on app's healthcheck below, not the other
      # way around.
    healthcheck:
      # /api/health is proxied straight through to PocketBase (nginx.conf's
      # ^/(api|_) location), so this only goes green once BOTH nginx and
      # PocketBase are actually serving — not just nginx (which supervisord
      # starts before pocketbase; see docker/supervisord.conf priorities).
      # certbot and pb-seed both depend on this, so it's what stops them
      # from racing app's cold start.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:80/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - litellm-external

  # -- PocketBase seed (one-shot) --
  # Registers the shared library resources and template on every fresh compose stack.
  pb-seed:
    build:
      context: .
      dockerfile: docker/pb-seed/Dockerfile
    container_name: messebuddy-pb-seed
    environment:
      PB_URL: http://app/
    depends_on:
      app:
        condition: service_healthy
    networks:
      - litellm-external
    restart: on-failure:5

volumes:
  pb_data:
    driver: local
  litellm_db_data:
    driver: local
  vector_db_data:
    driver: local
  app_runtime:
    driver: local
  nginx_ssl:
    driver: local
  certbot_webroot:
    driver: local
  # certbot_letsencrypt is intentionally NOT a named volume — see the
  # `certbot` service comment above. It's a bind mount to
  # ./docker/certbot/letsencrypt (gitignored) so it survives `down -v`.

networks:
  litellm-internal:
    driver: bridge
    internal: true
  litellm-external:
    driver: bridge
