# MesseBuddy — Docker Compose
#
# Services:
#   app       — nginx (PWA :80) + PocketBase (:8090) in one container
#   litellm   — LiteLLM proxy (:4000), OpenAI-compatible /chat/completions
#   pgvector  — PostgreSQL + pgvector extension (:5432), vector store for RAG
#
# Quick start:
#   cp .env.example .env          # fill in OPENAI_API_KEY (or another provider)
#   docker compose up --build
#
# The PWA at http://localhost expects:
#   PocketBase  → http://localhost:8090
#   LiteLLM     → http://localhost:4000
# These URLs are baked into the JS bundle at build time via VITE_* build args.
# To override for a remote deployment, pass them as --build-arg at image build time.
#
# The chatbot RAG pipeline:
#   useChatStream (PWA) → LiteLLM proxy → pgvector (semantic search) → AI Provider
# To update the knowledge base: re-embed and re-ingest documents into pgvector.
# No PWA code changes required.

services:

  # ── pgvector — Vector store for RAG ────────────────────────────────────────
  # PostgreSQL with pgvector extension. Stores embedded company documents
  # (policies, onboarding guides, FAQs). LiteLLM queries it at request time
  # to retrieve relevant chunks and augment the prompt before forwarding to
  # the configured AI provider.
  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-litellm_rag}
      POSTGRES_USER: ${PGVECTOR_USER:-litellm}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-changeme}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-litellm} -d ${PGVECTOR_DB:-litellm_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Document Ingestion (one-shot job) ─────────────────────────────────────
  # Runs once at startup, embeds all files in consume-docs/, stores chunks
  # in pgvector, then exits. Never restarts automatically.
  #
  # To update the knowledge base after adding/editing documents:
  #   docker compose run --rm ingest
  # No proxy restart required.
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    volumes:
      - ./consume-docs:/docs:ro          # Source documents (read-only)
    environment:
      PGVECTOR_CONNECTION_STRING: postgresql://${PGVECTOR_USER:-litellm}:${PGVECTOR_PASSWORD:-changeme}@pgvector:5432/${PGVECTOR_DB:-litellm_rag}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DOCS_DIR: /docs
    env_file:
      - path: .env
        required: false
    restart: "no"                        # One-shot; re-run manually to re-ingest
    depends_on:
      pgvector:
        condition: service_healthy

  # ── LiteLLM Proxy ──────────────────────────────────────────────────────────
  # Abstraction layer between the PWA and upstream AI providers.
  # Exposes a single OpenAI-compatible /chat/completions endpoint.
  # Handles model routing, provider auth, RAG (pgvector semantic search),
  # and system prompt injection. Swap providers or update embedded documents
  # by editing docker/litellm.yaml — no PWA code change required.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"                 # Exposed for direct browser access (prototype)
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
      - ./docker/rag_hook.py:/app/rag_hook.py:ro   # RAG + document-only enforcement hook
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      # Master key guards the proxy management endpoints (/health, /model/info…)
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-change-in-production}
      # Provider API keys — set via .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # pgvector connection — must match the pgvector service above
      PGVECTOR_CONNECTION_STRING: postgresql://${PGVECTOR_USER:-litellm}:${PGVECTOR_PASSWORD:-changeme}@pgvector:5432/${PGVECTOR_DB:-litellm_rag}
    env_file:
      - path: .env
        required: false             # Allow running without a .env file
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── App (PWA + PocketBase) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        # URLs the browser uses to reach each backend.
        # For local Docker usage the defaults work as-is.
        VITE_PB_URL: ${VITE_PB_URL:-http://localhost:8090}
        VITE_LITELLM_URL: ${VITE_LITELLM_URL:-http://localhost:4000}
        PB_VERSION: ${PB_VERSION:-0.23.0}
    ports:
      - "${APP_PORT:-80}:80"        # PWA
      - "8090:8090"                 # PocketBase REST + SSE + admin UI (/_/)
    volumes:
      - pb_data:/pb_data            # PocketBase SQLite DB + file storage
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_started

volumes:
  pb_data:
    driver: local
  pgvector_data:
    driver: local
