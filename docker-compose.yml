# MesseBuddy — Docker Compose
#
# Services:
#   app              — nginx (PWA :80) + PocketBase (:8090) in one container
#   litellm          — LiteLLM proxy (:4000), database mode + native pgvector RAG
#   litellm-pgvector — PG Vector store connector (:8001), document upload + search
#   postgres         — Single PostgreSQL instance with pgvector, serves:
#                      1) LiteLLM metadata (virtual keys, spend logs, model config)
#                      2) Vector store for RAG document embeddings
#   redis            — LiteLLM cache / rate-limit state
#
# Quick start:
#   cp .env.example .env          # fill in OPENAI_API_KEY (or another provider)
#   docker compose up --build
#
# The PWA at http://localhost expects:
#   PocketBase  → http://localhost:8090
#   LiteLLM     → http://localhost:4000
# These URLs are baked into the JS bundle at build time via VITE_* build args.
# To override for a remote deployment, pass them as --build-arg at image build time.
#
# RAG knowledge base:
#   Documents are managed via the LiteLLM Admin UI at http://localhost:4000/ui.
#   The litellm-pgvector connector handles chunking, embedding, and storage.
#   At query time, the pgvector connector retrieves relevant context and LiteLLM
#   injects it into the prompt automatically — no PWA code changes required.

services:

  # ── PostgreSQL + pgvector — Unified database ─────────────────────────────────
  # Single PostgreSQL instance with the pgvector extension installed.
  # Serves two roles:
  #   1. LiteLLM metadata store (virtual keys, spend logs, model configurations,
  #      API key management, team/org settings)
  #   2. RAG vector store (document chunk embeddings for semantic search)
  #
  # Healthcheck uses the configured user/db to confirm readiness.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: messebuddy-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"       # Host port; disable for production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── PG Vector Store Connector ────────────────────────────────────────────────
  # OpenAI-compatible /v1/vector_stores/* endpoints backed by PGVector.
  # LiteLLM routes document uploads and RAG queries through this service.
  #
  # Documents uploaded via Admin UI or POST /document/upload flow through
  # this connector: chunk → embed → store in pgvector.
  # At query time, LiteLLM calls this connector's search endpoint to retrieve
  # relevant chunks before calling the upstream LLM.
  litellm-pgvector:
    image: ghcr.io/berriai/litellm-pg-vector-store:latest
    container_name: litellm-pgvector
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-litellm}
      SERVER_API_KEY: ${LITELLM_MASTER_KEY:-sk-dev-change-in-production}
      EMBEDDING__MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING__BASE_URL: "http://litellm:4000"
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:-sk-dev-change-in-production}
      EMBEDDING__DIMENSIONS: ${EMBEDDING_DIM:-1536}
      HOST: "0.0.0.0"
      PORT: "8001"
      DB_FIELDS__ID_FIELD: "id"
      DB_FIELDS__CONTENT_FIELD: "content"
      DB_FIELDS__METADATA_FIELD: "metadata"
      DB_FIELDS__EMBEDDING_FIELD: "embedding"
      DB_FIELDS__VECTOR_STORE_ID_FIELD: "vector_store_id"
      DB_FIELDS__CREATED_AT_FIELD: "created_at"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── LiteLLM Proxy ────────────────────────────────────────────────────────────
  # Abstraction layer between the PWA and upstream AI providers.
  # Exposes a single OpenAI-compatible /chat/completions endpoint.
  #
  # Database mode (enabled via DATABASE_URL):
  #   - Stores virtual keys, spend logs, and model configurations in PostgreSQL
  #   - Enables the LiteLLM Admin UI for managing models, keys, and documents
  #
  # Native RAG with pgvector:
  #   - vector_store_registry in litellm.yaml configures the pgvector connector
  #   - vector_store_ids on the model makes RAG always-on (no PWA changes)
  #   - Users upload documents via the Admin UI or POST /document/upload
  #   - The litellm-pgvector connector chunks, embeds, and stores documents
  #   - At query time, relevant chunks are retrieved and injected into the prompt
  #
  # Swap providers or update system prompts by editing docker/litellm.yaml —
  # no PWA code change required.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"              # Exposed for direct browser access (prototype)
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      # Master key guards the proxy management endpoints (/health, /model/info…)
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-change-in-production}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_MASTER_KEY}

      # Provider API keys — set via .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Embedding model for RAG
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

      # ── Database mode ─────────────────────────────────────────────────────
      # Single PostgreSQL connection string. The same database serves BOTH
      # LiteLLM metadata (virtual keys, spend logs, model configs) AND
      # the pgvector vector store for RAG document chunks (via the connector).
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-litellm}

      # ── Redis (in-memory cache, rate-limit state) ─────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    env_file:
      - path: .env
        required: false         # Allow running without a .env file
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - litellm-internal
      - litellm-external
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python3", "-c", "import urllib.request, json, sys; r = urllib.request.urlopen('http://localhost:4000/health/readiness'); data = json.loads(r.read()); sys.exit(0 if data.get('status') == 'healthy' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── App (PWA + PocketBase) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        # URLs the browser uses to reach each backend.
        # For local Docker usage the defaults work as-is.
        VITE_PB_URL: ${VITE_PB_URL:-http://localhost:8090}
        VITE_LITELLM_URL: ${VITE_LITELLM_URL:-http://localhost:4000}
        PB_VERSION: ${PB_VERSION:-0.23.0}
    ports:
      - "${APP_PORT:-80}:80"     # PWA
      - "8090:8090"              # PocketBase REST + SSE + admin UI (/_/)
    volumes:
      - pb_data:/pb_data         # PocketBase SQLite DB + file storage
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_started
    networks:
      - litellm-external

  # ── Redis (LiteLLM cache / rate-limit state) ────────────────────────────────
  redis:
    image: redis:8.6-trixie
    container_name: litellm-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-internal

volumes:
  pb_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  litellm-internal:
    driver: bridge
    internal: true               # postgres, connector & redis not exposed to host
  litellm-external:
    driver: bridge
