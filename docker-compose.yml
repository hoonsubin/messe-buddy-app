# MesseBuddy - Docker Compose
# Services: app (nginx+PB), litellm-proxy, pgvector-connector, litellm-db, vector-db, file-watcher

services:

  # -- PostgreSQL (LiteLLM metadata) --
  # Separate from vector-db to avoid Prisma schema conflicts.
  litellm-db:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -- PostgreSQL + pgvector (Vector store) --
  vector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_VECTOR_DB:-litellm_vector}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - vector_db_data:/var/lib/postgresql/data
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_VECTOR_DB:-litellm_vector}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -- PG Vector Store Connector --
  litellm-pgvector:
    build:
      context: ./docker/litellm-pgvector
    container_name: litellm-pgvector
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@vector-db:5432/${POSTGRES_VECTOR_DB:-litellm_vector}
      SERVER_API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      EMBEDDING__MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      EMBEDDING__BASE_URL: http://litellm:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      EMBEDDING__DIMENSIONS: ${EMBEDDING_DIM:-768}
      RERANK__ENABLED: ${RERANK_ENABLED:-true}
      RERANK__MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      RERANK__CANDIDATES: ${RERANK_CANDIDATES:-30}
      HOST: "0.0.0.0"
      PORT: "8001"
      DB_FIELDS__ID_FIELD: "id"
      DB_FIELDS__CONTENT_FIELD: "content"
      DB_FIELDS__METADATA_FIELD: "metadata"
      DB_FIELDS__EMBEDDING_FIELD: "embedding"
      DB_FIELDS__VECTOR_STORE_ID_FIELD: "vector_store_id"
      DB_FIELDS__CREATED_AT_FIELD: "created_at"
    command: >
      sh -c "python enable_vector_ext.py && python -m prisma db push --skip-generate && uvicorn main:app --host 0.0.0.0 --port 8001"
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - litellm-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -- LiteLLM Proxy --
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      LLM_SERVER_API_KEY: ${LLM_SERVER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      PG_VECTOR_API_BASE: http://litellm-pgvector:8001
      PG_VECTOR_API_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-changeme}@litellm-db:5432/${POSTGRES_DB:-litellm}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - litellm-internal
      - litellm-external
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python3",
          "-c",
          "import urllib.request, json, sys; r = urllib.request.urlopen('http://localhost:4000/health/readiness'); data = json.loads(r.read()); sys.exit(0 if data.get('status') == 'healthy' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -- File Watcher --
  # Bootstraps vector store + LiteLLM registration once (idempotent), mints PWA virtual key, then watches consume-docs.
  file-watcher:
    build:
      context: ./docker/file-watcher
    container_name: messebuddy-file-watcher
    environment:
      POSTGRES_VECTOR_DB: ${POSTGRES_VECTOR_DB:-litellm_vector}
      POSTGRES_VECTOR_HOST: vector-db
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me-in-prod}
      VECTOR_STORE_ID: "messe-buddy-kb"
      VECTOR_STORE_NAME: "messe-buddy-knowledge-base"
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      LITELLM_DB_HOST: litellm-db
      # Char-based chunking sized for reranker's 512-token vLLM batch limit (~3 chars/token worst case).
      CHUNK_SIZE: ${CHUNK_SIZE:-1500}
      OVERLAP: ${OVERLAP:-150}
    volumes:
      - ./consume-docs:/consume-docs:ro
      - app_runtime:/runtime
    depends_on:
      vector-db:
        condition: service_healthy
      litellm-pgvector:
        condition: service_healthy
      litellm:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    networks:
      - litellm-internal
    restart: unless-stopped

  # -- App (PWA + PocketBase) --
  app:
    build:
      context: .
      args:
        VITE_PB_URL: /
        VITE_USE_MOCK_PB: ${VITE_USE_MOCK_PB:-false}
        VITE_LITELLM_URL: ${VITE_LITELLM_URL:-http://localhost:4000}
        VITE_LITELLM_MODEL: ${VITE_LITELLM_MODEL:-policy-assistant}
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - pb_data:/pb_data
      - app_runtime:/runtime:ro
      # Optional: mount mkcert certs for trusted HTTPS (see entrypoint.sh self-signed cert note).
    environment:
      PB_AUTO_MIGRATE: ${PB_AUTO_MIGRATE:-true}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - litellm-external

volumes:
  pb_data:
    driver: local
  litellm_db_data:
    driver: local
  vector_db_data:
    driver: local
  app_runtime:
    driver: local

networks:
  litellm-internal:
    driver: bridge
    internal: true
  litellm-external:
    driver: bridge
